<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task Manager Demo</title><link rel="stylesheet" href="style.css"><style>
.demo-wrap{min-height:70vh;padding:60px 0;background:#f5f8fc}.task-app{max-width:700px;margin:auto;background:#fff;border:1px solid #e6eaf1;border-radius:18px;padding:26px;box-shadow:0 8px 28px #17203308}.task-form{display:flex;gap:8px;margin:18px 0}.task-form input{flex:1;min-width:0;border:1px solid #dfe5ef;border-radius:8px;padding:12px;font:inherit}.task-form button{background:#1769f5;color:white}.task-list{padding:0;list-style:none}.task-list li{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eef1f6;padding:13px 0}.task-list li span{flex:1;overflow-wrap:anywhere}.task-list li.done span{text-decoration:line-through;color:#8a91a0}.task-list li button{background:#fff0f0;color:#b33b3b;padding:7px 10px;font-size:12px}.back{display:inline-block;margin-bottom:20px;color:#1769f5;font-weight:700}.task-note{font-size:12px;color:#8791a2}@media(max-width:500px){.task-form{flex-direction:column}.task-app{padding:18px}}
</style></head>
<body>
<header class="site-header"><nav class="nav container"><a class="logo" href="index.html">Aditya <span>Jivtode</span></a><a href="index.html" style="color:white">← Portfolio</a></nav></header>
<main class="demo-wrap"><div class="container"><a class="back" href="index.html#projects">← Back to portfolio</a><section class="task-app"><p class="eyebrow">PROJECT DEMO</p><h1 style="font:800 30px Manrope,Arial,sans-serif">Student Task Manager</h1><p style="color:#687386">Add study tasks, mark them complete, or remove them.</p><form class="task-form" id="taskForm"><input id="taskInput" placeholder="Enter a task..." required maxlength="100"><button class="btn" type="submit">Add Task</button></form><ul class="task-list" id="taskList"></ul><p class="task-note">Tasks are saved in this browser using localStorage.</p></section></div></main>
<script>
const form=document.getElementById('taskForm'),input=document.getElementById('taskInput'),list=document.getElementById('taskList');
let tasks=[];try{tasks=JSON.parse(localStorage.getItem('portfolioDemoTasks'))||[]}catch{}
function save(){localStorage.setItem('portfolioDemoTasks',JSON.stringify(tasks))}
function render(){list.innerHTML='';tasks.forEach(task=>{const li=document.createElement('li');li.className=task.done?'done':'';const cb=document.createElement('input');cb.type='checkbox';cb.checked=task.done;cb.addEventListener('change',()=>{task.done=cb.checked;save();render()});const span=document.createElement('span');span.textContent=task.text;const del=document.createElement('button');del.textContent='Delete';del.type='button';del.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render()});li.append(cb,span,del);list.append(li)})}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.unshift({id:Date.now(),text,done:false});save();render();input.value='';input.focus()});render();
</script></body></html>
